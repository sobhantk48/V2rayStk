plugins {
    id "com.android.application"
    id "org.jetbrains.kotlin.android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.example.v2ray_stk"
    compileSdk 36
    ndkVersion "27.2.12479018"

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    defaultConfig {
        applicationId "com.example.v2ray_stk"
        minSdk 24
        targetSdk 36
        versionCode flutter.versionCode
        versionName flutter.versionName

        // فقط arm64-v8a بسته‌بندی می‌شود.
        // مهم: splits { abi { ... } } را هرگز کنار این بلوک اضافه نکن،
        // و در دستور build از --split-per-abi استفاده نکن.
        ndk {
            abiFilters "arm64-v8a"
        }
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
            minifyEnabled false
            shrinkResources false
        }
    }

    lint {
        checkReleaseBuilds false
        abortOnError false
    }

    packaging {
        jniLibs {
            excludes += ["armeabi-v7a/**", "lib/armeabi-v7a/**", "**/armeabi-v7a/**", "armeabi/**", "lib/armeabi/**", "**/armeabi/**", "x86/**", "lib/x86/**", "**/x86/**", "x86_64/**", "lib/x86_64/**", "**/x86_64/**", "mips/**", "lib/mips/**", "**/mips/**", "mips64/**", "lib/mips64/**", "**/mips64/**", "riscv64/**", "lib/riscv64/**", "**/riscv64/**"]
            // libbox.so باید بدون فشرده‌سازی و قابل mmap بماند
            useLegacyPackaging false
            keepDebugSymbols += ["**/libbox.so"]
            // حذف صریح ABIهای ناخواسته که از AAR می‌آیند
        }
        resources {
            excludes += ["/META-INF/{AL2.0,LGPL2.1}"]
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source "../.."
}

dependencies {
    implementation fileTree(dir: "libs", include: ["*.aar"])
    implementation "org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3"
}

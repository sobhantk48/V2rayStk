name: Build Custom LibBox with Tor

on:
  workflow_dispatch:
  push:
    branches: [libbox-build]

jobs:
  build-libbox:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    env:
      GOTOOLCHAIN: local  # 🔒 جلوی auto-upgrade رو می‌گیره
      GO111MODULE: on

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go 1.22.9 (locked)
        uses: actions/setup-go@v5
        with:
          go-version: '1.22.9'
          check-latest: false  # ⛔ دیگه آخرین نسخه رو چک نکن!
          cache: false

      - name: Lock Go toolchain
        run: |
          echo "GOTOOLCHAIN=local" >> $GITHUB_ENV
          go version
          go env | grep -E "(GOVERSION|GOTOOLCHAIN)"

      - name: Use preinstalled NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> $GITHUB_ENV
          echo "NDK: $ANDROID_NDK_LATEST_HOME"

      - name: Clone sing-box (stable tag)
        run: |
          git clone --depth=1 --branch v1.12.4 \
            https://github.com/SagerNet/sing-box.git

      - name: Install gomobile/gobind (pinned version)
        run: |
          # نسخه‌های سازگار با Go 1.22
          GOTOOLCHAIN=local go install golang.org/x/mobile/cmd/gomobile@v0.0.0-20240909233030-6b76941cb6de
          GOTOOLCHAIN=local go install golang.org/x/mobile/cmd/gobind@v0.0.0-20240909233030-6b76941cb6de
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          go version  # چک کن هنوز 1.22.9 هست

      - name: Init gomobile
        run: |
          gomobile init -v
          go version  # یه بار دیگه چک کن

      - name: Build libbox.aar
        working-directory: sing-box
        run: |
          go version
          GOTOOLCHAIN=local gomobile bind -v \
            -target=android/arm64 \
            -androidapi 26 \
            -javapkg=io.nekohasekai \
            -trimpath \
            -ldflags="-s -w -buildid=" \
            -tags="with_gvisor,with_quic,with_wireguard,with_utls,with_ech,with_clash_api,with_embedded_tor" \
            -o ../libbox.aar \
            ./experimental/libbox

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: libbox-with-tor-arm64
          path: libbox.aar
          retention-days: 30


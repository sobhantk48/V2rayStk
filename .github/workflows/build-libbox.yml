name: Build libbox.aar

on:
  workflow_dispatch:
    inputs:
      singbox_ref:
        description: "sing-box tag/branch (خالی = برنچ پیش‌فرض ریپو)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build-libbox:
    runs-on: ubuntu-latest
    env:
      SING_BOX_TAGS: "with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api"
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Install gomobile
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Clone sing-box
        run: |
          REF="${{ github.event.inputs.singbox_ref }}"
          if [ -z "$REF" ]; then
            echo ">> کلون برنچ پیش‌فرض ریپو"
            git clone --depth 1 https://github.com/SagerNet/sing-box.git sing-box
          else
            echo ">> کلون ref مشخص‌شده: $REF"
            git clone --depth 1 --branch "$REF" \
              https://github.com/SagerNet/sing-box.git sing-box
          fi
          echo "----- نسخه‌ای که کلون شد -----"
          git -C sing-box log -1 --oneline

      - name: Add gomobile tool directive
        working-directory: sing-box
        run: |
          go get -tool golang.org/x/mobile/cmd/gobind
          go get golang.org/x/mobile/bind@latest
          go mod tidy

      - name: gomobile init
        working-directory: sing-box
        run: gomobile init

      - name: Build libbox.aar
        working-directory: sing-box
        run: |
          gomobile bind -v \
            -target=android \
            -androidapi 21 \
            -javapkg io.nekohasekai \
            -tags "$SING_BOX_TAGS" \
            -trimpath \
            -ldflags="-s -w" \
            -o libbox.aar \
            ./experimental/libbox

      - name: Verify package contents
        working-directory: sing-box
        run: |
          ls -lh libbox.aar
          unzip -l libbox.aar | grep -i "io/nekohasekai/libbox" || \
            (echo "libbox package not found!" && exit 1)

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: sing-box/libbox.aar
          retention-days: 30

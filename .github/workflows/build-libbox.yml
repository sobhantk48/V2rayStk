name: Build libbox.aar

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-libbox.yml'

jobs:
  build-libbox:
    runs-on: ubuntu-latest
    env:
      # نسخه‌ی sing-box که ازش libbox می‌سازیم
      SING_BOX_REF: v1.10.7
      # تگ‌های ساخت — بدون cronet تا از ارورهای لینک جلوگیری بشه
      BUILD_TAGS: with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          # این نسخه با sagernet/gomobile v0.1.4 سازگاره
          go-version: '1.23.4'
          check-latest: false

      - name: Setup Android NDK r25c
        id: setup-ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c
          add-to-path: false

      - name: Checkout sing-box source
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: ${{ env.SING_BOX_REF }}
          path: sing-box

      - name: Install SagerNet gomobile toolchain
        run: |
          # نصب gomobile و gobind با همون نسخه‌ی Go فعلی
          # این هماهنگی، ارور invalid reference to os.checkPidfdOnce رو حل می‌کنه
          go install -v github.com/sagernet/gomobile/cmd/gomobile@v0.1.4
          go install -v github.com/sagernet/gomobile/cmd/gobind@v0.1.4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Prepare sing-box module dependencies
        working-directory: sing-box
        run: |
          # مطمئن می‌شیم x/mobile توی گراف وابستگی‌ها هست
          go get golang.org/x/mobile/bind
          go mod tidy

      - name: Build libbox.aar
        working-directory: sing-box
        env:
          ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}
          NDK_ROOT: ${{ steps.setup-ndk.outputs.ndk-path }}
        run: |
          gomobile bind -v \
            -target=android \
            -androidapi 21 \
            -javapkg=io.nekohasekai \
            -libname=box \
            -tags "${BUILD_TAGS}" \
            -trimpath -ldflags "-s -w" \
            -o libbox.aar \
            ./experimental/libbox

      - name: Move AAR into app libs
        run: |
          mkdir -p android/app/libs
          mv sing-box/libbox.aar android/app/libs/libbox.aar
          ls -lh android/app/libs/

      - name: Upload libbox.aar artifact
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: android/app/libs/libbox.aar
          if-no-files-found: error

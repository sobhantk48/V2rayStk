name: Build libbox.aar

on:
  workflow_dispatch:
    inputs:
      singbox_ref:
        description: "sing-box tag/branch (خالی = برنچ پیش‌فرض ریپو)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build-libbox:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install NDK
        run: |
          sdkmanager "ndk;27.0.12077973"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/27.0.12077973" >> "$GITHUB_ENV"

      - name: Clone sing-box
        run: |
          REF="${{ github.event.inputs.singbox_ref }}"
          if [ -z "$REF" ]; then
            echo ">> کلون برنچ پیش‌فرض ریپو"
            git clone --depth 1 https://github.com/SagerNet/sing-box.git sing-box
          else
            echo ">> کلون ref مشخص‌شده: $REF"
            git clone --depth 1 --branch "$REF" \
              https://github.com/SagerNet/sing-box.git sing-box
          fi
          echo "----- نسخه‌ای که کلون شد -----"
          git -C sing-box log -1 --oneline
          echo "----- Go موردنیاز طبق go.mod -----"
          grep -E "^go " sing-box/go.mod

      - name: Setup Go (matching go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: sing-box/go.mod

      - name: Install SagerNet gomobile fork
        working-directory: sing-box
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.4
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build libbox.aar (official path)
        working-directory: sing-box
        run: |
          export PATH="$(go env GOPATH)/bin:$PATH"
          go run ./cmd/internal/build_libbox -target android

      - name: Locate produced AAR
        working-directory: sing-box
        run: |
          echo "----- جست‌وجوی libbox.aar -----"
          find . -name "libbox.aar" -exec ls -lh {} \;

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: sing-box/**/libbox.aar
          retention-days: 30

name: Build libbox.aar

on:
  workflow_dispatch:
    inputs:
      singbox_ref:
        description: "sing-box tag/branch (خالی = default branch)"
        required: false
        default: ""

jobs:
  build-libbox:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Clone sing-box
        run: |
          if [ -n "${{ github.event.inputs.singbox_ref }}" ]; then
            git clone --depth 1 --branch "${{ github.event.inputs.singbox_ref }}" \
              https://github.com/SagerNet/sing-box.git sing-box
          else
            git clone --depth 1 https://github.com/SagerNet/sing-box.git sing-box
          fi

      - name: Setup Go (from sing-box go.mod)
        uses: actions/setup-go@v5
        with:
          go-version-file: sing-box/go.mod
          cache: false

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android NDK (pinned)
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r25c

      - name: Install SagerNet gomobile fork
        working-directory: sing-box
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.4
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.4
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: gomobile init
        working-directory: sing-box
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: gomobile init

      - name: Build libbox.aar (without cronet)
        working-directory: sing-box
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          gomobile bind -v \
            -target=android \
            -androidapi 21 \
            -tags "with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api" \
            -trimpath -ldflags "-s -w" \
            -o libbox.aar \
            ./experimental/libbox

      - name: Upload libbox.aar
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: sing-box/libbox.aar
          if-no-files-found: error

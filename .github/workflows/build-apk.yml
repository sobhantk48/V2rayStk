name: Build APK

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

env:
  SING_BOX_REF: v1.10.7
  BUILD_TAGS: with_gvisor,with_quic,with_wireguard,with_utls,with_clash_api
  GO_VERSION: "1.23.4"
  FLUTTER_VERSION: "3.35.5"

jobs:
  libbox:
    name: Build libbox.aar
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.meta.outputs.key }}
    steps:
      - name: Compute cache key
        id: meta
        run: echo "key=libbox-${SING_BOX_REF}-${BUILD_TAGS}-ndk27" >> "$GITHUB_OUTPUT"

      - name: Restore cached AAR
        id: cache
        uses: actions/cache@v4
        with:
          path: libbox-out
          key: ${{ steps.meta.outputs.key }}

      - name: Checkout sing-box
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: ${{ env.SING_BOX_REF }}
          path: sing-box
          fetch-depth: 1

      - name: Setup Java 17
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: sing-box/go.sum

      - name: Setup Android NDK
        if: steps.cache.outputs.cache-hit != 'true'
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r27c
          add-to-path: false

      - name: Install gomobile
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: sing-box
        run: |
          go install golang.org/x/mobile/cmd/gomobile@latest
          go install golang.org/x/mobile/cmd/gobind@latest
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: gomobile bind
        if: steps.cache.outputs.cache-hit != 'true'
        working-directory: sing-box
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -e
          gomobile init
          gomobile bind -v \
            -target=android/arm64,android/arm \
            -androidapi 24 \
            -javapkg=io.nekohasekai \
            -libname=box \
            -tags "${BUILD_TAGS}" \
            -trimpath -ldflags "-s -w" \
            -o libbox.aar \
            ./experimental/libbox
          mkdir -p ../libbox-out
          mv libbox.aar ../libbox-out/libbox.aar

      - name: Upload AAR
        uses: actions/upload-artifact@v4
        with:
          name: libbox-aar
          path: libbox-out/libbox.aar
          if-no-files-found: error
          retention-days: 7

  apk:
    name: Build Flutter APK
    needs: libbox
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Download libbox.aar
        uses: actions/download-artifact@v4
        with:
          name: libbox-aar
          path: android/app/libs

      - name: Verify AAR present
        run: |
          ls -lh android/app/libs
          test -f android/app/libs/libbox.aar

      - name: flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos || true

      - name: Test
        run: flutter test || true

      - name: Build release APKs
        run: flutter build apk --release --split-per-abi

      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: V2rayStk-release-apks
          path: build/app/outputs/flutter-apk/*.apk
          if-no-files-found: error

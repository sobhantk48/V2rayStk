name: Build APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

env:
  FLUTTER_VERSION: "3.44.9"

permissions:
  contents: write

jobs:
  apk:
    name: Build Flutter APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Verify AAR in repo
        run: |
          set -euo pipefail
          ls -lh android/app/libs || true
          git ls-files android/app/libs
          count=$(find android/app/libs -maxdepth 1 -name '*.aar' | wc -l)
          echo "aar count = $count"
          if [ ! -f android/app/libs/libbox.aar ]; then
            echo "::error::android/app/libs/libbox.aar is missing. Run: git add -f android/app/libs/libbox.aar"
            exit 1
          fi
          if [ "$count" -ne 1 ]; then
            echo "::error::expected exactly 1 aar, found $count"
            exit 1
          fi
          unzip -l android/app/libs/libbox.aar | head -n 30

      - name: flutter pub get
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --no-fatal-infos || true

      - name: Run unit tests
        run: flutter test --reporter compact

      # مهم: --split-per-abi استفاده نمی‌شود.
      # ABIها در android/app/build.gradle با ndk.abiFilters قفل شده‌اند
      # (arm64-v8a + armeabi-v7a). اضافه کردن --split-per-abi باعث خطای
      # "Conflicting configuration" می‌شود.
      - name: Build release APK
        run: |
          set -o pipefail
          flutter build apk --release --verbose 2>&1 | tee build-log.txt
          status=${PIPESTATUS[0]}
          echo "build exit code: $status"
          exit $status

      - name: Show build errors
        if: failure()
        run: |
          echo "=================== ERROR GREP ==================="
          grep -nE "FAILURE:|BUILD FAILED|What went wrong|Caused by|error:|Unresolved reference|duplicate class|Conflicting configuration|Execution failed" build-log.txt | tail -n 80 || echo "no matches"
          echo "=================== LAST 250 LINES ==================="
          tail -n 250 build-log.txt || true
          echo "=================== GRADLE DAEMON LOGS ==================="
          find ~/.gradle/daemon -name '*.log' -exec tail -n 60 {} \; 2>/dev/null || true

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build-log.txt
          if-no-files-found: warn
          retention-days: 7

      - name: List APKs
        if: always()
        run: ls -lhR build/app/outputs/flutter-apk 2>/dev/null || echo "missing"

      - name: Verify ABIs inside APK
        if: success()
        run: |
          set -euo pipefail
          apk=build/app/outputs/flutter-apk/app-release.apk
          echo "--- lib/ entries ---"
          unzip -l "$apk" | grep -E "lib/" || echo "no native libs"
          echo "--- libbox.so ---"
          unzip -l "$apk" | grep -E "libbox\.so" || echo "::warning::libbox.so not found in APK"

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: V2rayStk-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

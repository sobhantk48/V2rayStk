name: Build APK & Package Offline Dependencies

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Make Gradle wrapper executable
        run: chmod +x android/gradlew

      - name: Get Flutter dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Package Offline Dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y zstd
          mkdir -p /tmp/offline_payload
          
          # Copy Gradle cache and distributions
          mkdir -p /tmp/offline_payload/.gradle
          if [ -d "$HOME/.gradle/caches" ]; then
            cp -r "$HOME/.gradle/caches" /tmp/offline_payload/.gradle/
          fi
          if [ -d "$HOME/.gradle/wrapper/dists" ]; then
            mkdir -p /tmp/offline_payload/.gradle/wrapper
            cp -r "$HOME/.gradle/wrapper/dists" /tmp/offline_payload/.gradle/wrapper/
          fi
          
          # Copy Pub cache
          if [ -d "$PUB_CACHE" ]; then
            cp -r "$PUB_CACHE" /tmp/offline_payload/.pub-cache
          elif [ -d "$HOME/.pub-cache" ]; then
            cp -r "$HOME/.pub-cache" /tmp/offline_payload/.pub-cache
          fi

          # Archive everything into tar.zst
          tar -C /tmp/offline_payload -cf - . | zstd -19 -T0 -o offline-dependencies.tar.zst

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Offline Dependencies Artifact
        uses: actions/upload-artifact@v4
        with:
          name: offline-dependencies
          path: offline-dependencies.tar.zst
